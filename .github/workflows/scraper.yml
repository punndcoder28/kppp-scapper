name: Tender Scraper

on:
  schedule:
    - cron: '30 2 * * 1'   # Monday 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * 4'   # Thursday 8:00 AM IST (2:30 AM UTC)
  workflow_dispatch:         # Manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          sudo apt-get install -y libasound2t64 libgbm1 libnss3 libxss1 libasound2t64 libatk-bridge2.0-0 libgtk-3-0
          playwright install chromium

      - name: Fetch tenders and update run date
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python main.py --fetch-only

      - name: Commit run date before evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add last_run.txt
          git diff --cached --quiet || git commit -m "chore(state): update last_run for $(date +%Y-%m-%d)"
          git push origin main

      - name: Evaluate and generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --evaluate-only

      - name: Push state to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add last_run.txt seen_tenders.json
          git diff --cached --quiet || git commit -m "chore(state): update scraper state for $(date +%Y-%m-%d)"
          git push origin main

      - name: Push report branch
        run: |
          DATE="$(date +%Y-%m-%d)"
          BRANCH="report/$DATE"
          git checkout -b "$BRANCH"
          git add reports/ index.html
          git diff --cached --quiet || git commit -m "chore(reports): add tender report for $DATE"
          git push origin "$BRANCH" --force

